<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f766e">
<title>3PHG Magang · Radiology Training Portal</title>
<style>
*{box-sizing:border-box;margin:0}
:root{--bg:#f2faf9;--card:#fff;--card2:#fff;--line:#d6e7e5;--p:#0f766e;--p2:#14b8a6;--c:#0d9488;--t:#0f2a2e;--m:#5d7679;--ok:#059669;--bad:#e11d48;--w:#d97706;--sh:0 1px 2px #0f766e14,0 10px 28px #0f766e14}
body{background:linear-gradient(180deg,#e0f4f1 0,var(--bg) 320px) fixed;color:var(--t);font:15px/1.6 Inter,system-ui,"Segoe UI",Roboto,sans-serif;min-height:100vh}
h1{font-size:clamp(22px,3vw,30px);letter-spacing:-.02em;margin-bottom:4px}h2{font-size:22px}h3{font-size:16px;margin-bottom:8px}
.mut,small{color:var(--m)}small{display:block;font-size:12.5px}
a{color:var(--c);text-decoration:none;cursor:pointer;font-weight:500}
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;padding:22px 14px;background:#fff;border-right:1px solid var(--line);box-shadow:4px 0 24px #0f766e0d;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;gap:11px;align-items:center;padding:0 8px 20px;font-weight:700;color:var(--p)}.brand small{font-weight:400}
.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-weight:800;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;flex:none;box-shadow:0 6px 16px #0f766e40}
.nv{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:12px;color:var(--m);font-weight:600;background:none;border:0;font-family:inherit;font-size:14.5px;cursor:pointer;text-align:left;transition:.2s}
.nv:hover{background:#0f766e12;color:var(--p)}.nv.on{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;box-shadow:0 6px 16px #0f766e40}
.sp{flex:1}.who{padding:12px 10px;border-top:1px solid var(--line);font-size:13px;font-weight:600}
main{padding:28px clamp(16px,4vw,44px) 60px;max-width:1200px;width:100%;animation:fi .35s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.banner{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:26px 28px;border-radius:22px;margin-bottom:18px;color:#fff;background:radial-gradient(500px 220px at 100% 0,#5eead466,transparent),linear-gradient(135deg,#0f766e,#0d9488 60%,#14b8a6);box-shadow:0 14px 34px #0f766e40}
.banner h1,.banner p{color:#fff}.banner p{opacity:.9}.chip{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 12px;border-radius:99px;background:#ffffff2e;margin-bottom:8px}
.bn{text-align:center;background:#ffffff26;border-radius:18px;padding:12px 24px}.bn b{font-size:34px;display:block;line-height:1.1}.bn small{color:#e6fffb}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin:14px 0;box-shadow:var(--sh)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin:14px 0}.grid .card{margin:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px;margin:14px 0}.grid2 .card{margin:0}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.row.l{justify-content:flex-start}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;cursor:pointer;color:#fff!important;font-weight:600;font-size:14px;font-family:inherit;padding:10px 18px;border-radius:12px;background:linear-gradient(135deg,var(--p),var(--p2));box-shadow:0 6px 16px #0f766e38;transition:.2s}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.ghost{background:#fff;box-shadow:none;border:1px solid var(--line);color:var(--p)!important}.btn.ghost:hover{background:#f0fbf9}.btn.cy{background:linear-gradient(135deg,#0891b2,#14b8a6)}.btn.sm{padding:6px 12px;font-size:12.5px}.btn.dg{background:#e11d48;box-shadow:0 6px 14px #e11d4833}
.tag{display:inline-block;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:700;background:#0f766e12;color:var(--m)}.tag.ok{background:#05966918;color:var(--ok)}.tag.run{background:#0891b218;color:#0e7490}.tag.bad{background:#e11d4814;color:var(--bad)}.tag.w{background:#d9770618;color:var(--w)}
.bar{height:9px;border-radius:9px;background:#dff0ee;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),#2dd4bf);border-radius:9px;transition:width .6s}
.ring{--v:0;width:98px;height:98px;border-radius:50%;display:grid;place-items:center;flex:none;background:conic-gradient(var(--p2) calc(var(--v)*1%),#dff0ee 0)}.ring b{width:78px;height:78px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:20px;color:var(--p)}
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.mc{display:block;color:var(--t);transition:.25s}.mc:hover{border-color:var(--p2);transform:translateY(-4px);box-shadow:0 16px 36px #0f766e24}.mc.lk{opacity:.55}.mc .ic{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font-size:26px;background:linear-gradient(135deg,#ccfbf1,#cffafe);margin-bottom:10px}.mc p{min-height:44px;font-size:13.5px;color:var(--m)}
.li{display:flex;gap:12px;align-items:center;color:var(--t);padding:14px 18px;margin:8px 0;transition:.2s}.li:hover{border-color:var(--p2);transform:translateX(4px)}.li .ck{font-size:20px}
.back{display:inline-block;margin-bottom:10px;font-size:14px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);font-size:14px;white-space:nowrap}th{color:var(--p);background:#f0fbf9;font-size:12px;text-transform:uppercase;letter-spacing:.05em}tr:hover td{background:#f8fdfc}
label{display:block;font-size:13px;color:var(--m);font-weight:600;margin:10px 0 0}input,select,textarea{width:100%;margin-top:5px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 13px;color:var(--t);font:inherit}input:focus,select:focus,textarea:focus{outline:3px solid #14b8a64d;border-color:var(--p2)}
input[type=radio]{width:auto;margin:3px 10px 0 0;accent-color:var(--p)}
.media{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#000;box-shadow:var(--sh)}.media.tall{aspect-ratio:auto;height:75vh}.media iframe,.media video{position:absolute;inset:0;width:100%;height:100%;border:0}
.prose{font-size:16px;line-height:1.8}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;border:1px solid var(--line);cursor:zoom-in;transition:.2s}.gal img:hover{transform:scale(1.03)}
.opt{display:flex;align-items:flex-start;padding:11px 14px;border:1px solid var(--line);border-radius:12px;margin-top:8px;cursor:pointer;color:var(--t);font-size:14.5px;transition:.15s}.opt:hover{border-color:var(--p2);background:#f0fbf9}.opt.ok{border-color:var(--ok);background:#05966912}.opt.no{border-color:var(--bad);background:#e11d4810}
.stick{position:sticky;top:8px;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-radius:16px;background:#ffffffee;backdrop-filter:blur(8px);border:1px solid var(--line);box-shadow:var(--sh);margin:12px 0}.stick b{font-size:22px;color:var(--p);font-variant-numeric:tabular-nums}
.ov{position:fixed;inset:0;background:#0f2a2ea6;backdrop-filter:blur(3px);display:grid;place-items:center;z-index:50;padding:16px;overflow:auto}
.modal{background:#fff;border-radius:20px;padding:24px;width:min(520px,100%);max-height:92vh;overflow:auto;box-shadow:0 30px 70px #0f2a2e55}.modal .row{margin-top:18px;justify-content:flex-end}
.ov.zm{display:block;text-align:center}.ov.zm img{max-width:96vw;max-height:82vh;cursor:zoom-in;border-radius:10px}.ov.zm img.z{max-width:none;max-height:none;width:220%;cursor:zoom-out}.ov.zm button{position:fixed;top:14px;right:14px}
#toast{position:fixed;right:16px;top:16px;z-index:99;display:grid;gap:8px}.toast{background:#fff;border:1px solid var(--line);border-left:4px solid var(--p2);padding:12px 18px;border-radius:12px;max-width:340px;box-shadow:0 12px 32px #0f766e2e;font-size:14px;animation:fi .25s}.toast.err{border-left-color:var(--bad)}
.ld{min-height:100vh;display:grid;place-items:center}
.lg{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}.lgl{padding:56px;color:#fff;display:flex;flex-direction:column;justify-content:center;gap:16px;background:radial-gradient(600px 300px at 90% 0,#5eead455,transparent),linear-gradient(145deg,#0f766e,#0d9488 55%,#14b8a6)}.lgl h2{font-size:38px;line-height:1.15;letter-spacing:-.02em}.lgl p,.lgl li{opacity:.92}.lgl ul{list-style:none;padding:0;display:grid;gap:10px;margin-top:8px}.lgl .logo{background:#fff;color:var(--p);box-shadow:none;width:54px;height:54px;font-size:20px}
.lgr{display:grid;place-items:center;padding:28px}.lgc{width:min(380px,100%)}.lgc h1{margin:0}.lgc .btn{width:100%;margin-top:20px;padding:12px}.lnk{display:block;margin-top:16px;font-size:13px;text-align:center}
.bars .r{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;font-size:13.5px}.bars .bar{margin:6px 0}
.stat{font-size:30px;font-weight:800;color:var(--p)}.grid .card:has(.stat){border-left:5px solid var(--p2)}
.cert{background:#fff;color:#111;text-align:center;padding:50px 30px;border:10px double #0f766e;border-radius:6px;margin:16px auto;max-width:820px;-webkit-print-color-adjust:exact;print-color-adjust:exact}.cert .cb{letter-spacing:.4em;font-weight:800;color:#0f766e;font-size:26px}.cert h2{font-size:34px;margin:10px 0;color:#0d9488}.cert p{color:#444}
@media(max-width:800px){.shell{display:block}aside{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px;z-index:20;border-top:1px solid var(--line);border-right:0;box-shadow:0 -6px 20px #0f766e14}.brand,.sp,.who{display:none}.nv{flex:1;flex-direction:column;gap:2px;font-size:11px;padding:6px 2px;text-align:center;justify-content:center}main{padding:18px 14px 92px}.bars .r{grid-template-columns:90px 1fr 38px}.lg{grid-template-columns:1fr}.lgl{display:none}.banner{padding:20px}}
@media print{aside,.noprint,#toast{display:none!important}.shell{display:block}body{background:#fff}main{padding:0;max-width:none}.card{box-shadow:none}}
</style>
</head>
<body>
<div id="app"></div><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,sendPasswordResetEmail,createUserWithEmailAndPassword,setPersistence,inMemoryPersistence}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{getDatabase,ref,get,set,update,push,remove,onValue,query,limitToLast}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const cfg={apiKey:"AIzaSyBobRbjeXfFYj7JNMisex8L1fN6PhZA8e8",authDomain:"magang-3phg.firebaseapp.com",databaseURL:"https://magang-3phg-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"magang-3phg",storageBucket:"magang-3phg.firebasestorage.app",messagingSenderId:"291866452855",appId:"1:291866452855:web:030a4bbba05881c1a33772"};
const fb=initializeApp(cfg),auth=getAuth(fb),db=getDatabase(fb),auth2=getAuth(initializeApp(cfg,'sec'));

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr=o=>Object.entries(o||{}).map(([id,v])=>({id,...(typeof v==='object'?v:{})}));
const toast=(m,e)=>{const t=document.createElement('div');t.className='toast'+(e?' err':'');t.textContent=m;$('#toast').append(t);setTimeout(()=>t.remove(),4200)};
const fd=t=>t?new Date(t).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}):'-';
const fdt=t=>t?new Date(t).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'Belum pernah';
const safe=u=>/^https?:\/\//i.test((u||'').trim())?u.trim():'';
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const embed=u=>{let m=u.match(/(?:youtu\.be\/|v=|embed\/)([\w-]{11})/);if(m)return'https://www.youtube.com/embed/'+m[1];m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/);return m?`https://drive.google.com/file/d/${m[1]}/preview`:u};
const TL={video:'🎬 Video',pdf:'📄 PDF / Slide',text:'📝 Teks',img:'🖼️ Galeri radiograf'};
const nf=()=>'<div class="card">Halaman tidak ditemukan.</div>';
const empty=t=>`<div class="card mut">${t}</div>`;
const mean=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;
const readXlsx=async f=>{const wb=XLSX.read(await f.arrayBuffer());return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''})};

/* ---------- state ---------- */
const S={u:null,admin:false,me:null,ready:false,mods:[],ann:[],dl:[],qa:[],users:[],prog:{},att:{},allProg:{},allAtt:{},act:[],unsub:[],batch:''};
let Q={};
const mats=m=>arr(m?.materials),qs=m=>arr(m?.questions);
const pg=u=>S.admin?(S.allProg[u]||{}):S.prog, at=u=>S.admin?(S.allAtt[u]||{}):S.att;
function info(uid,m){
  const mt=mats(m),d=pg(uid)[m.id]?.done||{},n=mt.filter(x=>d[x.id]).length,tot=mt.length;
  const as=arr(at(uid)[m.id]),post=as.filter(a=>a.type==='post'),pre=as.filter(a=>a.type==='pre');
  const hasPost=qs(m).some(q=>q.set==='post'),passed=post.some(a=>a.pass);
  const units=tot+(hasPost?1:0),dn=n+(hasPost&&passed?1:0);
  return{n,tot,pre,post,passed,hasPost,units,pct:units?Math.round(dn/units*100):0,complete:units>0&&dn===units,
    best:post.length?Math.max(...post.map(a=>a.score)):null,preBest:pre.length?Math.max(...pre.map(a=>a.score)):null,
    status:units>0&&dn===units?'Selesai':(n>0||as.length)?'Sedang berjalan':'Belum mulai'};
}
const overall=uid=>S.mods.length?mean(S.mods.map(m=>info(uid,m).pct)):0;
const isLocked=(uid,i)=>!S.admin&&i>0&&S.mods[i].lock&&!info(uid,S.mods[i-1]).complete;
const allAtts=()=>{const r=[];for(const[u,ms]of Object.entries(S.allAtt))for(const[mid,as]of Object.entries(ms||{}))for(const[id,a]of Object.entries(as||{}))r.push({...a,id,u,mid});return r};
const R=()=>location.hash.replace(/^#\/?/,'').split('/');
const badge=s=>`<span class="tag ${s==='Selesai'?'ok':s==='Sedang berjalan'?'run':''}">${s}</span>`;

/* ---------- modal / form ---------- */
function modal(html){const d=document.createElement('div');d.className='ov';d.innerHTML=`<div class="modal">${html}<div class="row"><button class="btn ghost" data-x>Tutup</button></div></div>`;d.querySelector('[data-x]').onclick=()=>d.remove();document.body.append(d)}
function form(title,fields,ok,sub='Simpan'){
  const d=document.createElement('div');d.className='ov';
  d.innerHTML=`<form class="modal"><h3>${title}</h3>${fields.map(f=>`<label>${f.l}${f.t==='textarea'?`<textarea name="${f.k}" rows="${f.r||4}" ${f.req?'required':''}>${esc(f.v)}</textarea>`:f.t==='select'?`<select name="${f.k}">${f.o.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(f.v)?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`:`<input name="${f.k}" type="${f.t||'text'}" value="${esc(f.v)}" ${f.req?'required':''} ${f.ph?`placeholder="${esc(f.ph)}"`:''}>`}</label>`).join('')}<div class="row"><button type="button" class="btn ghost" data-x>Batal</button><button class="btn">${sub}</button></div></form>`;
  document.body.append(d);d.querySelector('[data-x]').onclick=()=>d.remove();
  d.querySelector('form').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('.btn:not(.ghost)');b.disabled=true;try{await ok(Object.fromEntries(new FormData(e.target)));d.remove()}catch(x){toast(x.message,1);b.disabled=false}};
}

/* ---------- user creation (secondary auth so admin stays signed in) ---------- */
async function addUser({name,email,batch}){
  email=email.trim().toLowerCase();await setPersistence(auth2,inMemoryPersistence);
  const c=await createUserWithEmailAndPassword(auth2,email,crypto.randomUUID()+'Aa1!'),uid=c.user.uid;
  await set(ref(db,'users/'+uid),{name:name.trim(),email,batch:(batch||'-').trim()||'-',active:true,createdAt:Date.now()});
  await sendPasswordResetEmail(auth2,email);await signOut(auth2);return uid;
}

/* ---------- views ---------- */
const V={};
const annList=()=>S.ann.map(a=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)"><b>${esc(a.title)}</b> <small>${fd(a.ts)}</small><p>${esc(a.body).replace(/\n/g,'<br>')}</p></div>`).join('')||'<p class="mut">Belum ada pengumuman.</p>';
const dlList=()=>S.dl.map(d=>{const n=Math.ceil((new Date(d.date+'T23:59:59')-Date.now())/864e5);return`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><div><b>${esc(d.title)}</b><small>${fd(d.date)}</small></div><span class="tag ${n<0?'':n<=3?'bad':'w'}">${n<0?'Lewat':n===0?'Hari ini':n+' hari lagi'}</span></div>`}).join('')||'<p class="mut">Tidak ada jadwal.</p>';

V.dash=()=>{
  const uid=S.u.uid,ov=overall(uid),last=S.prog.last,lm=last&&S.mods.find(x=>x.id===last.mod),ok=lm&&mats(lm).some(x=>x.id===last.mat);
  const h=new Date().getHours(),g=h<11?'pagi':h<15?'siang':h<18?'sore':'malam';
  return`<div class="banner"><div><span class="chip">Radiology Training Portal</span><h1>Selamat ${g}, ${esc((S.me.name||'').split(' ')[0])} 👋</h1><p>Teruskan perjalanan belajarmu hari ini.</p></div><div class="bn"><b>${ov}%</b><small>progres total</small></div></div>
  <div class="grid2"><div class="card hero"><div class="ring" style="--v:${ov}"><b>${ov}%</b></div><div><h3>Progres belajar</h3><p class="mut" style="margin-bottom:12px">${S.mods.filter(m=>info(uid,m).complete).length} dari ${S.mods.length} modul selesai</p>${ok?`<a class="btn cy" href="#/learn/${last.mod}/${last.mat}">▶ Lanjutkan belajar</a>`:'<a class="btn cy" href="#/mods">Mulai belajar</a>'}</div></div>
  <div class="card"><h3>⏰ Jadwal ujian &amp; deadline</h3>${dlList()}</div></div>
  <div class="card"><h3>📢 Pengumuman trainer</h3>${annList()}</div>`;
};

V.mods=()=>`<h1>Modul Pembelajaran</h1><p class="mut">Pilih modul untuk mulai belajar.</p><div class="grid">${S.mods.map((m,i)=>{const f=info(S.u.uid,m),lk=isLocked(S.u.uid,i);
  return`<a class="card mc ${lk?'lk':''}" ${lk?'data-a="lockmsg"':`href="#/mod/${m.id}"`}><div class="ic">${esc(m.icon||'🩻')}</div><h3>${esc(m.title)}</h3><p class="mut">${esc(m.desc)}</p><div class="bar"><i style="width:${f.pct}%"></i></div><div class="row">${lk?'<span class="tag">🔒 Terkunci</span>':badge(f.status)}<small>${f.pct}%</small></div></a>`}).join('')||empty('Belum ada modul.')}</div>`;

V.mod=id=>{
  const i=S.mods.findIndex(x=>x.id===id);if(i<0)return nf();const m=S.mods[i],uid=S.u.uid;
  if(isLocked(uid,i))return'<div class="card">🔒 Modul terkunci. Selesaikan modul sebelumnya terlebih dahulu.</div><a href="#/mods">← Kembali</a>';
  const f=info(uid,m),d=pg(uid)[id]?.done||{},max=m.attempts||3,hasPre=qs(m).some(q=>q.set==='pre'),rem=f.post.length>0&&!f.passed;
  return`<a class="back" href="#/mods">← Semua modul</a><h1>${esc(m.icon||'')} ${esc(m.title)}</h1><p class="mut">${esc(m.desc)}</p>
  <div class="card"><div class="row"><b>Progres ${f.pct}%</b>${badge(f.status)}</div><div class="bar"><i style="width:${f.pct}%"></i></div><small>KKM ${m.kkm||70} · Durasi ujian ${m.duration||15} menit · Maks ${max} percobaan post-test</small></div>

V.learn=(mid,xid)=>{
  const i=S.mods.findIndex(x=>x.id===mid),m=S.mods[i];if(!m)return nf();if(isLocked(S.u.uid,i))return'<div class="card">🔒 Modul terkunci.</div>';
  const mt=mats(m),j=mt.findIndex(x=>x.id===xid),x=mt[j];if(!x)return nf();
  const P=pg(S.u.uid)[mid]||{},done=!!P.done?.[xid],u=safe(x.url);let body='';
  if(x.type==='video')body=!u?'<p class="mut">URL video tidak valid.</p>':/\.(mp4|webm|ogg)(\?|$)/i.test(u)?`<div class="media"><video controls src="${esc(u)}"></video></div>`:`<div class="media"><iframe src="${esc(embed(u))}" allowfullscreen allow="autoplay; encrypted-media"></iframe></div>`;
  else if(x.type==='pdf')body=u?`<div class="media tall"><iframe src="${esc(embed(u))}"></iframe></div><p style="margin-top:8px"><a href="${esc(u)}" target="_blank" rel="noopener">Buka di tab baru ↗</a></p>`:'<p class="mut">URL dokumen tidak valid.</p>';
  else if(x.type==='img')body=`<div class="gal">${(x.text||'').split('\n').map(safe).filter(Boolean).map(s=>`<img loading="lazy" src="${esc(s)}" alt="Radiograf" data-a="zoom" data-u="${esc(s)}">`).join('')}</div><small style="margin-top:6px">Klik gambar untuk memperbesar.</small>`;
  else body=`<div class="prose">${esc(x.text).replace(/\n/g,'<br>')}</div>`;
  const pv=mt[j-1],nx=mt[j+1];
  return`<a class="back" href="#/mod/${mid}">← ${esc(m.title)}</a><h1>${esc(x.title)}</h1><p class="mut">${TL[x.type]||''} · Materi ${j+1} dari ${mt.length}</p>
  <div class="card">${body}</div>
  <div class="card"><h3>📝 Catatan pribadi</h3><textarea rows="4" data-c="note" data-m="${mid}" data-x="${xid}" placeholder="Tulis catatanmu di sini (tersimpan otomatis saat selesai mengetik)">${esc(P.notes?.[xid])}</textarea></div>
  <div class="row"><div class="row l">${pv?`<a class="btn ghost" href="#/learn/${mid}/${pv.id}">← Sebelumnya</a>`:''}${nx?`<a class="btn ghost" href="#/learn/${mid}/${nx.id}">Berikutnya →</a>`:`<a class="btn ghost" href="#/mod/${mid}">Ke evaluasi →</a>`}</div><button class="btn ${done?'ghost':'cy'}" data-a="done" data-m="${mid}" data-x="${xid}">${done?'✔ Selesai (klik untuk batalkan)':'Tandai selesai'}</button></div>`;
};

const quizErr=(m,type)=>{const f=info(S.u.uid,m);if(!qs(m).some(q=>q.set===type))return'Soal belum tersedia.';
  if(type==='post'){if(f.n<f.tot)return'Selesaikan semua materi terlebih dahulu.';if(f.passed)return'Anda sudah lulus post-test.';if(f.post.length>=(m.attempts||3))return'Batas percobaan habis. Hubungi trainer.'}return''};
function startQuiz(mid,type){
  clearInterval(Q.t);Q={mid,type,done:false};const m=S.mods.find(x=>x.id===mid);if(!m){Q.err='Modul tidak ditemukan.';return}
  Q.err=quizErr(m,type);if(Q.err)return;Q.qs=shuffle(qs(m).filter(q=>q.set===type));Q.end=Date.now()+(m.duration||15)*60000;Q.t=setInterval(tick,1000);
}
function tick(){const s=Math.max(0,Math.round((Q.end-Date.now())/1000)),e=$('#tm');if(e)e.textContent=`${String(s/60|0).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;if(s<=0&&!Q.done){toast('Waktu habis — jawaban dikirim otomatis.');ACT.submit()}}
V.quiz=(mid,type)=>{
  const m=S.mods.find(x=>x.id===mid);if(!m||Q.mid!==mid)return nf();const T=type==='pre'?'Pre-test':'Post-test';
  if(Q.done){const kkm=m.kkm||70,f=info(S.u.uid,m),left=type==='post'&&!Q.pass&&f.post.length<(m.attempts||3);
    return`<h1>Hasil ${T}</h1><div class="card hero"><div class="ring" style="--v:${Q.score}"><b>${Q.score}</b></div><div><h3>${type==='pre'?'Pre-test selesai':Q.pass?'Selamat, Anda lulus! 🎉':'Belum lulus'}</h3><p class="mut" style="margin-bottom:12px">${Q.ok} dari ${Q.qs.length} benar${type==='post'?` · KKM ${kkm}`:''}</p><div class="row l"><a class="btn ghost" href="#/mod/${mid}">← Ke modul</a>${left?`<button class="btn" data-a="retry" data-m="${mid}" data-t="${type}">Remedial: ulangi</button>`:''}${Q.pass&&f.complete?`<a class="btn cy" href="#/cert/${mid}">🎓 Sertifikat</a>`:''}</div></div></div>
    <h3>Pembahasan</h3>${Q.qs.map((q,i)=>`<div class="card"><b>${i+1}. ${esc(q.q)}</b>${[...q.opts].map((o,j)=>o?`<div class="opt ${j===q.ans?'ok':j===Q.ans[i]?'no':''}">${'ABCD'[j]}. ${esc(o)} ${j===q.ans?'✔':j===Q.ans[i]?'✘ (jawabanmu)':''}</div>`:'').join('')}${Q.ans[i]<0?'<small style="margin-top:8px;color:var(--w)">Tidak dijawab</small>':''}${q.exp?`<p class="mut" style="margin-top:10px">💡 ${esc(q.exp).replace(/\n/g,'<br>')}</p>`:''}</div>`).join('')}`}
  if(Q.err)return`<a class="back" href="#/mod/${mid}">← Kembali</a><div class="card"><h3>${T}</h3><p>${esc(Q.err)}</p></div>`;
  return`<h1>${T} · ${esc(m.title)}</h1><p class="mut">${Q.qs.length} soal · Jawaban dikirim otomatis saat waktu habis.</p>
  <div class="stick"><span>Sisa waktu <b id="tm">--:--</b></span><button class="btn cy" data-a="submit">Kirim jawaban</button></div>
  ${Q.qs.map((q,i)=>`<div class="card"><b>${i+1}. ${esc(q.q)}</b>${[...q.opts].map((o,j)=>o?`<label class="opt"><input type="radio" name="q${i}" value="${j}">${'ABCD'[j]}. ${esc(o)}</label>`:'').join('')}</div>`).join('')}
  <button class="btn cy" data-a="submit">Kirim jawaban</button>`;
};

  <div class="grid2"><div class="card"><div class="row"><h3>📢 Pengumuman</h3><button class="btn sm" data-a="aadd">+ Posting</button></div>${S.ann.map(a=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><div><b>${esc(a.title)}</b><small>${fd(a.ts)}</small></div><button class="btn sm dg" data-a="adel" data-id="${a.id}">✕</button></div>`).join('')||'<p class="mut">Kosong.</p>'}</div>
  <div class="card"><div class="row"><h3>⏰ Deadline / ujian</h3><button class="btn sm" data-a="dadd">+ Jadwal</button></div>${S.dl.map(d=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><div><b>${esc(d.title)}</b><small>${fd(d.date)}</small></div><button class="btn sm dg" data-a="ddel" data-id="${d.id}">✕</button></div>`).join('')||'<p class="mut">Kosong.</p>'}</div></div>
  <h3 style="margin-top:22px">💬 Pertanyaan peserta</h3>${S.qa.map(q=>`<div class="card"><div class="row"><b>${esc(q.name)}</b><small>${fdt(q.ts)}</small></div><p>${esc(q.q).replace(/\n/g,'<br>')}</p>${q.a?`<p style="margin-top:8px;border-left:3px solid var(--c);padding-left:10px">${esc(q.a).replace(/\n/g,'<br>')}</p>`:''}<div class="row l" style="margin-top:10px"><button class="btn sm" data-a="ans" data-id="${q.id}">${q.a?'Ubah jawaban':'Jawab'}</button><button class="btn sm dg" data-a="qadel" data-id="${q.id}">Hapus</button></div></div>`).join('')||empty('Belum ada pertanyaan.')}`;

/* ---------- actions ---------- */
const ACT={};
ACT.lockmsg=()=>toast('Selesaikan modul sebelumnya terlebih dahulu.',1);
ACT.forgot=async()=>{const e=$('#lf').e.value.trim();if(!e)return toast('Isi email terlebih dahulu.',1);await sendPasswordResetEmail(auth,e).catch(()=>{});toast('Jika email terdaftar, tautan reset password telah dikirim.')};
ACT.out=()=>signOut(auth);
ACT.zoom=d=>{const o=document.createElement('div');o.className='ov zm';o.innerHTML=`<img src="${esc(d.u)}" alt=""><button class="btn ghost">✕ Tutup</button>`;o.querySelector('img').onclick=e=>e.target.classList.toggle('z');o.querySelector('button').onclick=()=>o.remove();document.body.append(o)};
ACT.done=async d=>{const was=!!pg(S.u.uid)[d.m]?.done?.[d.x];await set(ref(db,`progress/${S.u.uid}/${d.m}/done/${d.x}`),was?null:true);toast(was?'Ditandai belum selesai.':'Materi selesai ✔')};
ACT.retry=d=>{startQuiz(d.m,d.t);draw();tick()};
ACT.submit=async()=>{
  if(Q.done||Q.busy||!Q.qs)return;Q.busy=1;clearInterval(Q.t);const m=S.mods.find(x=>x.id===Q.mid);
  Q.ans=Q.qs.map((_,i)=>{const c=document.querySelector(`input[name=q${i}]:checked`);return c?+c.value:-1});
  Q.ok=Q.ans.filter((a,i)=>a===Q.qs[i].ans).length;Q.score=Math.round(Q.ok/Q.qs.length*100);Q.pass=Q.score>=(m.kkm||70);Q.done=true;Q.busy=0;
  draw();scrollTo(0,0);
  try{await push(ref(db,`attempts/${S.u.uid}/${Q.mid}`),{type:Q.type,score:Q.score,pass:Q.pass,ok:Q.ok,total:Q.qs.length,ts:Date.now()})}catch(e){toast('Gagal menyimpan nilai: '+e.message,1)}
};
ACT.ask=()=>form('Ajukan pertanyaan',[{k:'q',l:'Pertanyaan',t:'textarea',r:5,req:1}],async v=>{await push(ref(db,'qa'),{uid:S.u.uid,name:S.me.name,q:v.q.trim(),ts:Date.now()});toast('Pertanyaan terkirim.')},'Kirim');
ACT.myreset=async()=>{await sendPasswordResetEmail(auth,S.u.email);toast('Email reset password dikirim ke '+S.u.email)};
/* admin */
ACT.uadd=()=>form('Tambah peserta',[{k:'name',l:'Nama lengkap',req:1},{k:'email',l:'Email',t:'email',req:1},{k:'batch',l:'Angkatan / batch / unit',v:'Batch 1'}],async v=>{await addUser(v);toast('Akun dibuat. Email atur password dikirim ke '+v.email)},'Buat akun');
ACT.uimp=()=>$('#fu').click();
ACT.ureset=async d=>{await sendPasswordResetEmail(auth,d.e);toast('Email reset dikirim ke '+d.e)};
ACT.utoggle=async d=>{const u=S.users.find(x=>x.id===d.id);await set(ref(db,`users/${d.id}/active`),!u.active);toast(u.active?'Akun dinonaktifkan.':'Akun diaktifkan.')};
ACT.madd=()=>form('Modul baru',mf(),async v=>{await push(ref(db,'modules'),mv(v))});
ACT.medit=d=>form('Pengaturan modul',mf(S.mods.find(x=>x.id===d.id)),async v=>{await update(ref(db,'modules/'+d.id),mv(v))});
ACT.mdel=async d=>{if(confirm('Hapus modul beserta materi dan soalnya?'))await remove(ref(db,'modules/'+d.id))};
ACT.xadd=d=>form('Tambah materi',[{k:'type',l:'Jenis',t:'select',o:[['video','Video (YouTube / Drive / .mp4)'],['pdf','PDF / Slide (Drive / URL)'],['text','Teks'],['img','Galeri radiograf']]},{k:'title',l:'Judul',req:1},{k:'url',l:'URL (untuk video / PDF)',ph:'https://...'},{k:'text',l:'Isi teks, atau daftar URL gambar (satu per baris)',t:'textarea',r:5}],async v=>{
  const need=v.type==='video'||v.type==='pdf'?safe(v.url):v.type==='img'?v.text.split('\n').map(safe).filter(Boolean).length:v.text.trim();
  if(!need)throw new Error('Lengkapi isi materi sesuai jenisnya (URL harus diawali https://).');
  await push(ref(db,`modules/${d.id}/materials`),{type:v.type,title:v.title.trim(),url:v.url.trim(),text:v.text.trim()})});
ACT.xdel=async d=>{if(confirm('Hapus materi ini?'))await remove(ref(db,`modules/${d.id}/materials/${d.x}`))};
ACT.qadd=d=>form('Tambah soal',[{k:'set',l:'Jenis',t:'select',o:[['post','Post-test'],['pre','Pre-test']]},{k:'q',l:'Pertanyaan',t:'textarea',r:3,req:1},...['A','B','C','D'].map(x=>({k:x,l:'Opsi '+x,req:x<'C'})),{k:'ans',l:'Jawaban benar',t:'select',o:['A','B','C','D'].map(x=>[x,x])},{k:'exp',l:'Pembahasan',t:'textarea',r:3}],async v=>{
  const opts=['A','B','C','D'].map(x=>v[x].trim()),ans='ABCD'.indexOf(v.ans);if(!opts[ans])throw new Error('Opsi untuk jawaban benar tidak boleh kosong.');
  await push(ref(db,`modules/${d.id}/questions`),{set:v.set,q:v.q.trim(),opts,ans,exp:v.exp.trim()})});
ACT.qdel=async d=>{if(confirm('Hapus soal ini?'))await remove(ref(db,`modules/${d.id}/questions/${d.x}`))};
ACT.qimp=()=>$('#fq').click();
ACT.aadd=()=>form('Posting pengumuman',[{k:'title',l:'Judul',req:1},{k:'body',l:'Isi',t:'textarea',r:5,req:1}],async v=>{await push(ref(db,'announcements'),{title:v.title.trim(),body:v.body.trim(),ts:Date.now()})});
ACT.adel=async d=>{if(confirm('Hapus pengumuman?'))await remove(ref(db,'announcements/'+d.id))};
ACT.dadd=()=>form('Tambah deadline / jadwal ujian',[{k:'title',l:'Judul',req:1},{k:'date',l:'Tanggal',t:'date',req:1}],async v=>{await push(ref(db,'deadlines'),{title:v.title.trim(),date:v.date})});
ACT.ddel=async d=>{if(confirm('Hapus jadwal?'))await remove(ref(db,'deadlines/'+d.id))};
ACT.ans=d=>{const q=S.qa.find(x=>x.id===d.id);form('Jawab pertanyaan',[{k:'a',l:esc(q.q),t:'textarea',r:5,v:q.a,req:1}],async v=>{await update(ref(db,'qa/'+d.id),{a:v.a.trim(),at:Date.now()})},'Kirim jawaban')};
ACT.qadel=async d=>{if(confirm('Hapus pertanyaan?'))await remove(ref(db,'qa/'+d.id))};
ACT.rapor=d=>{const u=S.users.find(x=>x.id===d.id);modal(`<h3>Rapor · ${esc(u.name)}</h3><small>${esc(u.email)} · ${esc(u.batch)} · Progres ${overall(u.id)}%</small><div class="tw"><table><tr><th>Modul</th><th>Status</th><th>Pre</th><th>Post</th><th>Coba</th></tr>${S.mods.map(m=>{const f=info(u.id,m);return`<tr><td>${esc(m.title)}</td><td>${f.status}</td><td>${f.preBest??'-'}</td><td>${f.best??'-'}</td><td>${f.post.length}</td></tr>`}).join('')}</table></div>`)};
ACT.xport=()=>{
  const rows=S.users.map(u=>{const r={Nama:u.name,Email:u.email,Batch:u.batch,Status:u.active?'Aktif':'Nonaktif','Progres %':overall(u.id)};S.mods.forEach(m=>{const f=info(u.id,m);r[m.title+' (post)']=f.best??'';});r['Login terakhir']=u.lastLogin?new Date(u.lastLogin).toLocaleString('id-ID'):'';return r});
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Rekap');XLSX.writeFile(wb,'rekap-magang.xlsx');
};
/* change handlers */
const CH={};
CH.note=(d,t)=>set(ref(db,`progress/${S.u.uid}/${d.m}/notes/${d.x}`),t.value.trim()||null).catch(e=>toast(e.message,1));
CH.batch=(d,t)=>{S.batch=t.value;draw()};
CH.impu=async(d,t)=>{
  const f=t.files[0];t.value='';if(!f)return;let ok=0;const bad=[];toast('Memproses impor…');
  for(const r of await readXlsx(f)){const n=String(r.Nama??r.nama??'').trim(),e=String(r.Email??r.email??'').trim();if(!n||!e)continue;
    try{await addUser({name:n,email:e,batch:String(r.Batch??r.batch??'-')});ok++}catch(x){bad.push(e)}}
  toast(`${ok} akun dibuat${bad.length?`; gagal: ${bad.join(', ')}`:''}.`,bad.length>0);
};
CH.impq=async(d,t)=>{
  const f=t.files[0];t.value='';if(!f)return;const o={};let bad=0;
  for(const r of await readXlsx(f)){const opts=['A','B','C','D'].map(k=>String(r[k]??'').trim()),ans='ABCD'.indexOf(String(r.Jawaban).trim().toUpperCase()),q=String(r.Soal??'').trim();
    if(!q||ans<0||!opts[ans]){bad++;continue}
    o[push(ref(db,`modules/${d.id}/questions`)).key]={set:String(r.Set).toLowerCase()==='pre'?'pre':'post',q,opts,ans,exp:String(r.Pembahasan??'').trim()}}
  if(Object.keys(o).length)await update(ref(db,`modules/${d.id}/questions`),o);
  toast(`${Object.keys(o).length} soal diimpor${bad?`, ${bad} baris dilewati`:''}.`,bad>0);
};
document.addEventListener('click',async e=>{const t=e.target.closest('[data-a]');const f=t&&ACT[t.dataset.a];if(!f)return;try{await f(t.dataset,t)}catch(x){console.error(x);toast(x.message,1)}});
document.addEventListener('change',async e=>{const t=e.target.closest('[data-c]');const f=t&&CH[t.dataset.c];if(!f)return;try{await f(t.dataset,t)}catch(x){console.error(x);toast(x.message,1)}});
document.addEventListener('submit',async e=>{
  if(e.target.id!=='lf')return;e.preventDefault();const f=e.target,b=f.querySelector('button');b.disabled=true;
  try{await signInWithEmailAndPassword(auth,f.e.value.trim(),f.p.value)}catch(x){toast(/invalid|wrong|not-found/.test(x.code)?'Email atau password salah.':x.code==='auth/too-many-requests'?'Terlalu banyak percobaan. Coba lagi nanti.':x.message,1);b.disabled=false}
});

/* ---------- shell / routing ---------- */
const NAV_U=[['dash','🏠','Beranda'],['mods','📚','Modul'],['results','📊','Nilai'],['qa','💬','Tanya'],['profile','👤','Profil']];
const NAV_A=[['a/dash','📈','Dashboard'],['a/users','👥','Peserta'],['a/mods','📚','Modul'],['a/report','🧾','Laporan'],['a/comm','📢','Komunikasi']];
function login(){app.innerHTML=`<div class="lg"><div class="lgl"><div class="logo">3P</div><h2>Belajar radiologi,<br>lebih terarah.</h2><p>Portal pelatihan magang dengan modul terstruktur, evaluasi terukur, dan sertifikat otomatis.</p><ul><li>📚 Modul berurutan dengan materi video, PDF &amp; galeri radiograf</li><li>📝 Pre-test &amp; post-test dengan timer dan pembahasan</li><li>🎓 Sertifikat otomatis setelah lulus</li></ul></div><div class="lgr"><form id="lf" class="lgc"><h1>Masuk</h1><p class="mut">Gunakan email yang didaftarkan oleh admin.</p><label>Email<input name="e" type="email" required autocomplete="username"></label><label>Password<input name="p" type="password" required autocomplete="current-password"></label><button class="btn">Masuk</button><a class="lnk" data-a="forgot">Lupa password?</a></form></div></div>`}
function draw(){
  if(!S.u||!S.ready)return;const p=R();let k=p[0]||'';
  if(S.admin){k=k==='a'?'a/'+(p[1]||'dash'):'a/dash'}else if(!V[k]||k.startsWith('a/'))k='dash';
  const args=k.startsWith('a/')?(p[0]==='a'?p.slice(2):[]):p.slice(1);
  const nav=S.admin?NAV_A:NAV_U,on=k==='a/mod'?'a/mods':['mod','learn','quiz','cert'].includes(k)?'mods':k;
  let body;try{body=(V[k]||V.dash)(...args)}catch(e){console.error(e);body='<div class="card">Terjadi kesalahan tampilan. Muat ulang halaman.</div>'}
  app.innerHTML=`<div class="shell"><aside><div class="brand"><div class="logo">3P</div><div>3PHG Magang<small>Radiology Training</small></div></div>${nav.map(n=>`<a class="nv ${n[0]===on?'on':''}" href="#/${n[0]}"><span>${n[1]}</span>${n[2]}</a>`).join('')}<div class="sp"></div><div class="who">${esc(S.admin?'Administrator':S.me.name)}<small>${esc(S.u.email)}</small></div><button class="nv" data-a="out"><span>⎋</span>Keluar</button></aside><main>${body}</main></div>`;
}
let raf=0;
const live=()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;if(R()[0]==='quiz'||document.querySelector('.ov')||/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||''))return;const y=scrollY;draw();scrollTo(0,y)})};
function onRoute(){
  clearInterval(Q.t);const p=R();
  if(p[0]==='learn'&&!S.admin){const m=S.mods.find(x=>x.id===p[1]),x=mats(m).find(y=>y.id===p[2]);
    if(x){set(ref(db,`progress/${S.u.uid}/last`),{mod:p[1],mat:p[2]}).catch(()=>{});push(ref(db,'activity'),{uid:S.u.uid,name:S.me.name,mod:m.title,mat:x.title,ts:Date.now()}).catch(()=>{})}}
  if(p[0]==='quiz'&&!S.admin)startQuiz(p[1],p[2]);
  draw();scrollTo(0,0);if(p[0]==='quiz'&&Q.qs&&!Q.err&&!Q.done)tick();
}
addEventListener('hashchange',onRoute);

const sub=(p,fn)=>new Promise(res=>{let first=1;S.unsub.push(onValue(typeof p==='string'?ref(db,p):p,s=>{fn(s.val());if(first){first=0;res()}else live()},e=>{console.warn(e.message);res()}))});
onAuthStateChanged(auth,async u=>{
  S.unsub.forEach(f=>f());S.unsub=[];S.ready=false;S.u=u;S.me=null;S.admin=false;
  if(!u){login();return}
  app.innerHTML='<div class="ld"><div class="mut">Memuat…</div></div>';
  try{
    S.admin=(await get(ref(db,'admins/'+u.uid))).exists();
    if(!S.admin){S.me=(await get(ref(db,'users/'+u.uid))).val();
      if(!S.me||!S.me.active){await signOut(auth);toast('Akun belum terdaftar atau dinonaktifkan. Hubungi admin.',1);return}
      set(ref(db,`users/${u.uid}/lastLogin`),Date.now()).catch(()=>{})}
    const jobs=[sub('modules',v=>S.mods=arr(v).sort((a,b)=>(a.order||0)-(b.order||0))),sub('announcements',v=>S.ann=arr(v).sort((a,b)=>b.ts-a.ts)),sub('deadlines',v=>S.dl=arr(v).sort((a,b)=>a.date>b.date?1:-1)),sub('qa',v=>S.qa=arr(v).sort((a,b)=>b.ts-a.ts))];
    if(S.admin)jobs.push(sub('users',v=>S.users=arr(v).sort((a,b)=>a.name>b.name?1:-1)),sub('progress',v=>S.allProg=v||{}),sub('attempts',v=>S.allAtt=v||{}),sub(query(ref(db,'activity'),limitToLast(60)),v=>S.act=arr(v).sort((a,b)=>b.ts-a.ts)));
    else jobs.push(sub('progress/'+u.uid,v=>S.prog=v||{}),sub('attempts/'+u.uid,v=>S.att=v||{}));
    await Promise.all(jobs);S.ready=true;onRoute();
  }catch(e){console.error(e);toast('Gagal memuat data: '+e.message,1)}
});
</script>
</body>
